version: 2.1

# ─────────────────────────────────────────────
# Reusable executor
# ─────────────────────────────────────────────
executors:
  node:
    docker:
      - image: cimg/node:20.18
    working_directory: ~/repo

# ─────────────────────────────────────────────
# Reusable commands
# ─────────────────────────────────────────────
commands:
  restore-root-cache:
    steps:
      - restore_cache:
          keys:
            - root-deps-v1-{{ checksum "package-lock.json" }}
            - root-deps-v1-

  save-root-cache:
    steps:
      - save_cache:
          key: root-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - apps/api/node_modules
            - apps/web/node_modules

# ─────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────
jobs:
  test-api:
    executor: node
    steps:
      - checkout
      - restore-root-cache
      - run:
          name: Install dependencies
          command: npm ci
      - save-root-cache
      - run:
          name: Run API tests
          command: npm test --workspace=apps/api

  test-web:
    executor: node
    steps:
      - checkout
      - restore-root-cache
      - run:
          name: Install dependencies
          command: npm ci
      - save-root-cache
      - run:
          name: Type-check web app
          command: npm run type-check --workspace=apps/web

  simulate:
    executor: node
    steps:
      - checkout
      - restore-root-cache
      - run:
          name: Install dependencies
          command: npm ci
      - save-root-cache
      - run:
          name: Start API
          command: npm run dev --workspace=apps/api
          background: true
      - run:
          name: Wait for API
          command: npx wait-on tcp:3001 --timeout 60000
      - run:
          name: Run simulation
          command: npm run simulate
          environment:
            API_URL: http://localhost:3001/api

  analyze-traces:
    executor: node
    steps:
      - checkout
      - run:
          name: Analyze Honeycomb traces with Claude
          command: node scripts/analyze-traces.mjs
      - store_artifacts:
          path: analysis.md
          destination: trace-analysis

  review-pr:
    executor: node
    steps:
      - checkout
      - run:
          name: Review PR with Claude
          command: node scripts/review-pr.mjs

  build:
    executor: node
    steps:
      - checkout
      - restore-root-cache
      - run:
          name: Install dependencies
          command: npm ci
      - save-root-cache
      - run:
          name: Build API
          command: npm run build --workspace=apps/api
      - run:
          name: Build web
          command: npm run build --workspace=apps/web
      - store_artifacts:
          path: apps/web/dist
          destination: web-dist

# ─────────────────────────────────────────────
# Workflows
# ─────────────────────────────────────────────
workflows:
  test-and-build:
    jobs:
      - test-api
      - test-web
      - review-pr
      - simulate:
          requires:
            - test-api
      - analyze-traces:
          requires:
            - simulate
      - build:
          requires:
            - test-api
            - test-web
          filters:
            branches:
              only: main
